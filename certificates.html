<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>شهادات شكر وتقدير - تميز ملزمة العلوم - أ. صبري محمد حمد</title>
  <link href="https://fonts.googleapis.com/css2?family=Amiri:wght@700&family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet">
  <style>
    :root {
      --navy: #0f172a;
      --royal: #1e3a8a;
      --blue: #2563eb;
      --gold: #b45309;
      --gold-light: #d97706;
      --gold-soft: #fef3c7;
      --gold-border: #f59e0b;
      --bg: #e2e8f0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Tajawal', sans-serif;
    }

    body {
      background: var(--bg);
      color: var(--navy);
      padding: 1.5rem 1rem 4rem;
    }

    /* لوحة التحكم العلوية (تختفي عند الطباعة) */
    .control-panel {
      max-width: 1120px;
      margin: 0 auto 1.8rem;
      background: white;
      border-radius: 20px;
      padding: 1.5rem;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      border: 2px solid #cbd5e1;
    }

    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 1rem;
      margin-bottom: 1.2rem;
      padding-bottom: 1rem;
      border-bottom: 2px dashed #e2e8f0;
    }

    .panel-header h1 {
      font-size: 1.45rem;
      color: var(--royal);
      font-weight: 900;
    }

    .panel-header p {
      color: #475569;
      font-weight: 600;
      font-size: 0.95rem;
      margin-top: 0.25rem;
    }

    .actions-row {
      display: flex;
      flex-wrap: wrap;
      gap: 0.75rem;
      align-items: center;
      justify-content: space-between;
    }

    .class-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 0.55rem;
    }

    .tab-btn {
      background: #f8fafc;
      color: var(--navy);
      border: 2px solid #cbd5e1;
      padding: 0.65rem 1.15rem;
      border-radius: 12px;
      font-weight: 800;
      font-size: 0.95rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .tab-btn:hover {
      border-color: var(--blue);
      background: #eff6ff;
    }

    .tab-btn.active {
      background: var(--royal);
      color: white;
      border-color: var(--royal);
      box-shadow: 0 4px 12px rgba(30, 58, 138, 0.25);
    }

    .print-all-btn {
      background: linear-gradient(135deg, #059669, #047857);
      color: white;
      border: none;
      padding: 0.85rem 1.6rem;
      border-radius: 14px;
      font-size: 1.05rem;
      font-weight: 900;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      box-shadow: 0 6px 16px rgba(5, 150, 105, 0.3);
      transition: transform 0.2s;
    }

    .print-all-btn:hover {
      transform: translateY(-2px);
    }

    .add-Quick-row {
      margin-top: 1rem;
      padding-top: 1rem;
      border-top: 1px solid #e2e8f0;
      display: flex;
      flex-wrap: wrap;
      gap: 0.6rem;
      align-items: center;
    }

    .add-Quick-row input, .add-Quick-row select {
      padding: 0.6rem 0.9rem;
      border: 1.5px solid #cbd5e1;
      border-radius: 10px;
      font-size: 0.92rem;
      font-weight: 700;
    }

    .add-btn {
      background: var(--blue);
      color: white;
      border: none;
      padding: 0.6rem 1.1rem;
      border-radius: 10px;
      font-weight: 800;
      cursor: pointer;
    }

    /* حاوية الشهادات */
    .certificates-wrapper {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2.5rem;
    }

    /* تصميم الشهادة الأفقية الواحدة (مقاس A4 Landscape الدقيق) */
    .certificate-page {
      width: 297mm;
      height: 210mm;
      background: #ffffff;
      position: relative;
      padding: 8mm;
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.15);
      overflow: hidden;
      page-break-after: always;
      break-after: page;
    }

    /* الإطار الخارجي والداخلي المزخرف */
    .cert-outer-border {
      width: 100%;
      height: 100%;
      border: 4px solid var(--royal);
      border-radius: 18px;
      padding: 5px;
      position: relative;
      background: radial-gradient(circle at center, #ffffff 65%, #f8fafc 100%);
    }

    .cert-inner-border {
      width: 100%;
      height: 100%;
      border: 2.5px double var(--gold-border);
      border-radius: 14px;
      padding: 6mm 10mm 5mm;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      z-index: 2;
    }

    /* زخارف الزوايا العلمية */
    .corner-sci {
      position: absolute;
      font-size: 2.2rem;
      opacity: 0.14;
      pointer-events: none;
      z-index: 1;
    }
    .corner-tl { top: 12px; left: 16px; }
    .corner-tr { top: 12px; right: 16px; }
    .corner-bl { bottom: 12px; left: 16px; }
    .corner-br { bottom: 12px; right: 16px; }

    /* علامة مائية علمية في الوسط */
    .science-watermark {
      position: absolute;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13rem;
      opacity: 0.035;
      pointer-events: none;
      z-index: 0;
    }

    /* ترويسة المدرسة العلوية */
    .cert-top-banner {
      width: 100%;
      text-align: center;
      margin-bottom: 2mm;
    }

    .cert-top-banner img {
      max-height: 28mm;
      width: auto;
      max-width: 92%;
      object-fit: contain;
      display: block;
      margin: 0 auto;
    }

    /* شريط عنوان الشهادة */
    .cert-title-section {
      text-align: center;
      margin: 1mm 0 2mm;
    }

    .science-pill {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      background: linear-gradient(90deg, #eff6ff, #dbeafe, #eff6ff);
      color: var(--royal);
      border: 1.5px solid #93c5fd;
      padding: 0.2rem 1.2rem;
      border-radius: 999px;
      font-weight: 900;
      font-size: 0.95rem;
      margin-bottom: 1.5mm;
    }

    .cert-main-title {
      font-family: 'Amiri', serif;
      font-size: 2.35rem;
      color: var(--royal);
      line-height: 1.15;
      text-shadow: 0 2px 4px rgba(30, 58, 138, 0.1);
    }

    .cert-main-title span {
      color: var(--gold);
    }

    /* محتوى نص الشهادة */
    .cert-body {
      text-align: center;
      padding: 0 6mm;
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 2.5mm;
    }

    .intro-line {
      font-size: 1.18rem;
      font-weight: 700;
      color: #334155;
    }

    /* اسم الطالب والصف في مستطيل فاخر */
    .student-honor-box {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 1.2rem;
      flex-wrap: wrap;
      background: linear-gradient(135deg, #fffbeb 0%, #fef3c7 100%);
      border: 2px solid var(--gold-border);
      border-radius: 16px;
      padding: 2.5mm 8mm;
      margin: 0.5mm auto;
      box-shadow: 0 4px 12px rgba(180, 83, 9, 0.08);
    }

    .honored-name {
      font-size: 1.65rem;
      font-weight: 900;
      color: var(--royal);
    }

    .honored-class {
      background: var(--royal);
      color: white;
      padding: 0.25rem 0.9rem;
      border-radius: 10px;
      font-size: 1.05rem;
      font-weight: 800;
    }

    .appreciation-paragraph {
      font-size: 1.15rem;
      line-height: 1.75;
      font-weight: 700;
      color: #1e293b;
      max-width: 94%;
      margin: 0 auto;
    }

    .highlight-gold {
      color: var(--gold);
      font-weight: 900;
    }

    .highlight-royal {
      color: var(--royal);
      font-weight: 900;
    }

    /* شريط الأوسمة العلمية */
    .science-badges-row {
      display: flex;
      justify-content: center;
      gap: 1.2rem;
      margin-top: 1mm;
    }

    .sci-badge-item {
      background: #f8fafc;
      border: 1px solid #cbd5e1;
      padding: 0.25rem 0.85rem;
      border-radius: 99px;
      font-size: 0.88rem;
      font-weight: 800;
      color: var(--royal);
      display: inline-flex;
      align-items: center;
      gap: 0.35rem;
    }

    /* التوقيعات والختم في أسفل الشهادة */
    .cert-footer {
      display: grid;
      grid-template-columns: 1fr 1fr 0.9fr 1fr 1fr;
      align-items: end;
      text-align: center;
      padding-top: 2.5mm;
      border-top: 2px solid #e2e8f0;
      margin-top: 1mm;
    }

    .sig-block {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 1.2mm;
    }

    .sig-role {
      font-size: 0.88rem;
      font-weight: 800;
      color: #64748b;
    }

    .sig-name {
      font-size: 1rem;
      font-weight: 900;
      color: var(--navy);
    }

    .sig-line {
      width: 75%;
      height: 1px;
      border-bottom: 1.5px dashed #94a3b8;
      margin-top: 3mm;
    }

    /* ختم المدرسة في المنتصف */
    .stamp-block {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
    }

    .stamp-block img {
      height: 27mm;
      width: auto;
      object-fit: contain;
      mix-blend-mode: multiply;
      filter: contrast(1.08);
    }

    /* إعدادات الطباعة الدقيقة (كل شهادة في صفحة A4 أفقية مستقلة) */
    @media print {
      @page {
        size: A4 landscape;
        margin: 0;
      }

      html, body {
        background: #ffffff !important;
        padding: 0 !important;
        margin: 0 !important;
        -webkit-print-color-adjust: exact !important;
        print-color-adjust: exact !important;
      }

      .control-panel {
        display: none !important;
      }

      .certificates-wrapper {
        gap: 0 !important;
        display: block !important;
      }

      .certificate-page {
        width: 297mm !important;
        height: 210mm !important;
        box-shadow: none !important;
        margin: 0 !important;
        page-break-after: always !important;
        break-after: page !important;
      }

      .certificate-page:last-child {
        page-break-after: auto !important;
        break-after: auto !important;
      }
    }

    /* ملائمة العرض على شاشات الجوال والكمبيوتر الصغير قبل الطباعة */
    @media screen and (max-width: 1150px) {
      .certificate-page {
        width: 100%;
        height: auto;
        min-height: 540px;
      }
      .cert-footer {
        grid-template-columns: repeat(2, 1fr);
        gap: 1rem;
      }
    }
  </style>
</head>
<body>

  <!-- لوحة التحكم والفلترة (لا تظهر في الطباعة) -->
  <div class="control-panel">
    <div class="panel-header">
      <div>
        <h1>🏆 منصة إصدار وطباعة شهادات التميز في ملزمة العلوم</h1>
        <p id="syncStatus">✅ تم حصر الطلاب المتميزين في الملزمة (سبتمبر وأكتوبر 2026) وجاهزون للطباعة حسب الصف</p>
      </div>
      <button class="print-all-btn" onclick="window.print()">
        🖨️ طباعة جميع شهادات الصف المحدد معاً
      </button>
    </div>

    <div class="actions-row">
      <div class="class-tabs" id="classTabs"></div>
    </div>

    <!-- إضافة طالب إضافي للشهادات فورا عند الحاجة -->
    <div class="add-Quick-row">
      <strong style="font-size:0.9rem; color:var(--royal);">➕ إضافة طالب للشهادات يدوياً:</strong>
      <input type="text" id="newStudentName" placeholder="اسم الطالب ثلاثياً أو رباعياً...">
      <select id="newStudentClass">
        <option value="السادس الابتدائي فرقة 1">السادس الابتدائي فرقة 1</option>
        <option value="الثاني الاعدادي فرقة 1">الثاني الإعدادي فرقة 1</option>
        <option value="الثاني الاعدادي فرقة 2">الثاني الإعدادي فرقة 2</option>
        <option value="الثاني الاعدادي فرقة 3">الثاني الإعدادي فرقة 3</option>
        <option value="الثاني الاعدادي فرقة 4">الثاني الإعدادي فرقة 4</option>
      </select>
      <button class="add-btn" onclick="addManualStudent()">إضافة للشهادات</button>
    </div>
  </div>

  <!-- حاوية الشهادات -->
  <div class="certificates-wrapper" id="certificatesContainer"></div>

  <script>
    const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbxTqBIBEU69gXEJqNbTE6334vK5Ub4IU2txITzsG3XOUnAmg9VtBL5Tr88vveXcCGnsjg/exec";

    const BANNER_URL = "https://i.postimg.cc/K88X7RLb/trwysyh-dhhbyt.png";
    const STAMP_URL = "https://i.postimg.cc/x1zBrkqF/khtm-shfaf.jpg";

    // القائمة المحصورة من ملف الإكسيل جاهزة فوراً (ويتم تحديثها أيضاً تلقائياً من الإكسيل)
    let honoredStudents = [
      // الصف السادس الابتدائي فرقة 1
      { name: "إيليا سعيد حسن حسن", className: "السادس الابتدائي فرقة 1" },
      { name: "حسين عمار جاسم الاسكافي", className: "السادس الابتدائي فرقة 1" },
      { name: "سيدحامد حسين محمد درويش", className: "السادس الابتدائي فرقة 1" },
      { name: "صادق علي عبدالله اسماعيل", className: "السادس الابتدائي فرقة 1" },
      { name: "عبدالعزيز جلال عبدالعزيز حاجي عبدالله", className: "السادس الابتدائي فرقة 1" },
      { name: "عبدالله حسين عبدالله مال الله", className: "السادس الابتدائي فرقة 1" },
      { name: "ليث محمود مسعود الوطني", className: "السادس الابتدائي فرقة 1" },
      { name: "محمد صالح شوقي البناء", className: "السادس الابتدائي فرقة 1" },
      { name: "محمد عباس خميس السودان", className: "السادس الابتدائي فرقة 1" },
      { name: "نوح زهير عبدالوهاب غزوان", className: "السادس الابتدائي فرقة 1" },

      // الصف الثاني الإعدادي فرقة 1
      { name: "السيد محمد حسين حمزه علي", className: "الثاني الاعدادي فرقة 1" },
      { name: "حسين محمد حبيب غريب", className: "الثاني الاعدادي فرقة 1" },
      { name: "صادق جعفر عبدالوهاب البصري", className: "الثاني الاعدادي فرقة 1" },
      { name: "عباس عبدالله ابراهيم ال عميرى", className: "الثاني الاعدادي فرقة 1" },
      { name: "علي فيصل مختار محمد", className: "الثاني الاعدادي فرقة 1" },
      { name: "علي يوسف سلمان الصفار", className: "الثاني الاعدادي فرقة 1" },

      // الصف الثاني الإعدادي فرقة 2
      { name: "سجاد حسين محسن عاشور", className: "الثاني الاعدادي فرقة 2" },
      { name: "سجاد زهير حسن عبدالرسول", className: "الثاني الاعدادي فرقة 2" },
      { name: "علي حمد احمد علي", className: "الثاني الاعدادي فرقة 2" },

      // الصف الثاني الإعدادي فرقة 3
      { name: "يوسف زهير عبدالوهاب غزوان", className: "الثاني الاعدادي فرقة 3" }
    ];

    let selectedClass = "السادس الابتدائي فرقة 1";

    // جلب أي تحديثات جديدة مباشرة من ملف الإكسيل (لمن أُضيفت لهم "الملزمة منظمة" في أي صف)
    async function syncFromSheet() {
      try {
        const res = await fetch(`${SCRIPT_URL}?action=getStudentsList`);
        const json = await res.json();
        if (json.status === "success" && Array.isArray(json.students)) {
          const liveMatched = json.students.filter(st => {
            const pos = String(st.positives || "");
            return pos.includes("الملزمة منظمة") || pos.includes("اعمال رائعة") || pos.includes("أعمال رائعة");
          });

          liveMatched.forEach(st => {
            const exists = honoredStudents.some(h => h.name.trim() === st.name.trim());
            if (!exists) {
              honoredStudents.push({ name: st.name.trim(), className: st.className.trim() });
            }
          });

          document.getElementById("syncStatus").textContent =
            `✅ تم التزامن المباشر مع ملف الإكسيل — إجمالي الطلاب المكرمين: (${honoredStudents.length}) طالباً`;
          renderTabs();
          renderCertificates();
        }
      } catch (e) {
        // في حال عدم تحديث الاسكربت بعد، يعمل بالقائمة المحصورة فوراً بدون أي مشكلة
      }
    }

    function renderTabs() {
      const tabsContainer = document.getElementById("classTabs");
      const classes = [...new Set(honoredStudents.map(s => s.className))];

      tabsContainer.innerHTML = "";

      // زر عرض جميع الصفوف
      const allBtn = document.createElement("button");
      allBtn.className = `tab-btn ${selectedClass === "all" ? "active" : ""}`;
      allBtn.textContent = `كل الصفوف (${honoredStudents.length})`;
      allBtn.onclick = () => {
        selectedClass = "all";
        renderTabs();
        renderCertificates();
      };
      tabsContainer.appendChild(allBtn);

      classes.forEach(cls => {
        const count = honoredStudents.filter(s => s.className === cls).length;
        const btn = document.createElement("button");
        btn.className = `tab-btn ${selectedClass === cls ? "active" : ""}`;
        btn.textContent = `${cls} (${count})`;
        btn.onclick = () => {
          selectedClass = cls;
          renderTabs();
          renderCertificates();
        };
        tabsContainer.appendChild(btn);
      });
    }

    function addManualStudent() {
      const nameInput = document.getElementById("newStudentName");
      const classSelect = document.getElementById("newStudentClass");
      const name = nameInput.value.trim();
      const cls = classSelect.value;

      if (!name) return;
      honoredStudents.push({ name: name, className: cls });
      selectedClass = cls;
      nameInput.value = "";
      renderTabs();
      renderCertificates();
    }

    function renderCertificates() {
      const container = document.getElementById("certificatesContainer");
      const filtered = selectedClass === "all"
        ? honoredStudents
        : honoredStudents.filter(s => s.className === selectedClass);

      container.innerHTML = "";

      filtered.forEach(student => {
        const cert = document.createElement("div");
        cert.className = "certificate-page";

        cert.innerHTML = `
          <div class="cert-outer-border">
            <div class="science-watermark">⚛️</div>
            <span class="corner-sci corner-tl">🔬</span>
            <span class="corner-sci corner-tr">🧪</span>
            <span class="corner-sci corner-bl">🧬</span>
            <span class="corner-sci corner-br">⚛️</span>

            <div class="cert-inner-border">
              <!-- ترويسة المدرسة -->
              <div class="cert-top-banner">
                <img src="${BANNER_URL}" alt="ترويسة المدرسة">
              </div>

              <!-- عنوان الشهادة -->
              <div class="cert-title-section">
                <div class="science-pill">🔬 قسم العلوم — تكريم التميز لشهري سبتمبر وأكتوبر 2026م 🧪</div>
                <h2 class="cert-main-title">شهادة <span>شكر وتقدير</span> وتميز علمي</h2>
              </div>

              <!-- متن الشهادة -->
              <div class="cert-body">
                <p class="intro-line">
                  يسر إدارة المدرسة وقسم العلوم أن يتقدما بوافر الشكر وعظيم التقدير والاعتزاز إلى الطالب المتميز:
                </p>

                <div class="student-honor-box">
                  <span class="honored-name">🌟 ${student.name}</span>
                  <span class="honored-class">${student.className}</span>
                </div>

                <p class="appreciation-paragraph">
                  وإلى <span class="highlight-royal">ولي أمره الكريم</span> على اهتمامهم المثمر ومتابعتهم المستمرة لـ <span class="highlight-gold">ملزمة العلوم</span>، والحرص على استكمال الأنشطة وإثرائها بالصور والرسومات العلمية المبدعة، حتى ظهرت الملزمة بصورة <span class="highlight-gold">منظمة وكاملة ورائعة</span> خلال شهري <span class="highlight-royal">سبتمبر وأكتوبر 2026م</span>، سائلين الله له دوام التفوق والنجاح.
                </p>

                <div class="science-badges-row">
                  <span class="sci-badge-item">📘 ملزمة منظمة وكاملة ورائعة</span>
